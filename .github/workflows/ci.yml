name: WorkBridge CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pyflakes ruff pip-audit

      - name: Run Pyflakes
        run: |
          cd backend
          pyflakes .

      - name: Run Ruff (Linter)
        run: |
          cd backend
          ruff check .

      - name: Run pip-audit
        continue-on-error: true
        run: |
          cd backend
          pip-audit -r requirements.txt

      - name: Run Pytest with Coverage
        run: |
          cd backend
          pytest --cov=. --cov-report=term-missing

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP Lint
        run: |
          cd frontend
          find . -name "*.php" -print0 | xargs -0 -n1 php -l

  test-java-matching-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Maven
        run: |
          cd matching-service
          mvn clean test

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-java-matching-service]
    steps:
      - uses: actions/checkout@v3

      - name: Build Backend Image
        run: |
          cd backend
          docker build -t workbridge/backend:test .

      - name: Build Java Matching Service Image
        run: |
          cd matching-service
          docker build -t workbridge/matching-service:test .
