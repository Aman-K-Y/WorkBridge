# ============================================
# WorkBridge - Nginx Reverse Proxy Config
# ============================================
# Initially configured for HTTP only.
# After running certbot, replace this file with the SSL version below.

server {
    listen 80;
    server_name _;

    # Let's Encrypt challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy all traffic to the PHP frontend container
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # File upload size limit (for avatars, resumes)
        client_max_body_size 10M;
    }
}

